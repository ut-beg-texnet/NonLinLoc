name: regression

# Build NonLinLoc and verify that the core location pipeline still reproduces
# the frozen reference output. See tests/README.md.

on:
  push:
    branches: [ "**" ]
    paths:
      - "src/**"
      - "tests/**"
      - "nlloc_sample/**"
      - "nlloc_sample_test_frozen_20260625/**"
      - "nlloc_global_sample/**"
      - "nlloc_ssst_sample/**"
      - ".github/workflows/regression.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "nlloc_sample/**"
      - "nlloc_sample_test_frozen_20260625/**"
      - "nlloc_global_sample/**"
      - "nlloc_ssst_sample/**"
      - ".github/workflows/regression.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake build-essential

      - name: Build
        working-directory: src
        run: |
          mkdir -p bin
          cmake .
          make -j"$(nproc)"

      - name: Regression test (alaska / non-GLOBAL)
        run: tests/run_regression.sh

      - name: Regression test (neic / GLOBAL teleseismic)
        run: tests/run_regression_global.sh

      - name: Regression test (NLL-SSST Parkfield, tolerance)
        run: tests/run_regression_ssst.sh

      - name: QML confidence ellipsoid test (alaska, NLLoc + LocSum)
        run: tests/run_test_qml_ellipsoid.sh

      - name: Map projection round-trip test (lat,lon -> x,y -> lat,lon)
        run: tests/run_test_projection_roundtrip.sh

      # On Linux ARM (aarch64) char is unsigned. Build with -funsigned-char so
      # that code which depends on char being signed (e.g. storing fgetc() in a
      # char and comparing with EOF, which made NLLoc hang at the end of the
      # observation file) is caught here on x86.
      - name: Build with unsigned char (as on Linux ARM)
        run: |
          mkdir -p "${RUNNER_TEMP}/bin-uchar"
          MYBIN="${RUNNER_TEMP}/bin-uchar" cmake -S src -B "${RUNNER_TEMP}/build-uchar" -DCMAKE_C_FLAGS="-funsigned-char"
          make -C "${RUNNER_TEMP}/build-uchar" -j"$(nproc)"

      - name: Regression tests with unsigned char (alaska, neic, QML ellipsoid)
        env:
          NLL_BIN: ${{ runner.temp }}/bin-uchar
        run: |
          timeout 300 tests/run_regression.sh
          timeout 300 tests/run_regression_global.sh
          timeout 300 tests/run_test_qml_ellipsoid.sh
